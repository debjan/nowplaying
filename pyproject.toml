[project]
name = "nowplaying"
version = "0.1.0"
description = "Universal now-playing dashboard for any media app with live server-sent-event updates"
readme = "README.md"
authors = [
    { name = "debjan" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.20.0",
    "curl-cffi>=0.17.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
dbus = ["dbus-next>=0.2.3; sys_platform != 'win32'"]
windows = [
    "winrt-Windows.Media.Control>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1; sys_platform == 'win32'",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
nowplaying = "nowplaying.app:main"
nowplaying-monitor = "nowplaying.monitor:main"
nowplaying-web = "nowplaying.web:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["S", "DTZ", 'BLE001', "SIM"]

# Platform-specific imports: dbus-next exists only on Linux (dbus extra),
# winrt only on Windows (windows extra). ty checks all files on every
# platform, so silence unresolved-import per file (unused-ignore warnings
# on the native platform are harmless).
[[tool.ty.overrides]]
include = ["src/nowplaying/sources/dbus_source.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["src/nowplaying/sources/mpris_source.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["src/nowplaying/sources/windows_source.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["src/nowplaying/windows_control.py"]
rules = { unresolved-import = "ignore" }

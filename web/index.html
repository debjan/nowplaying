<!DOCTYPE html>
<html>
<head>
    <title>Now Playing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1D2021">
    <meta name="nowplaying-theme" content="">
    <meta name="description" content="Now Playing - live track metadata from any media app.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="favicon">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <script>
        // One step away in the blue channel: an imperceptible colour change that
        // Chromium still treats as a change (it compares the parsed colour).
        function nudgeColor(color) {
            const match = /^#([0-9a-f]{6})$/i.exec(color);
            if (!match) return null;
            const nudged = (parseInt(match[1], 16) ^ 1).toString(16).padStart(6, '0');
            return `#${nudged}`;
        }
        function syncThemeColor(force = false) {
            const meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) return;
            const style = getComputedStyle(document.documentElement);
            const background = (
                style.getPropertyValue('--background-color') ||
                style.getPropertyValue('--background')
            ).trim();
            if (!background) return;
            if (force === true && meta.content === background) {
                const nudged = nudgeColor(background);
                if (!nudged) return;
                meta.content = nudged;
                setTimeout(() => syncThemeColor(), 16);
                return;
            }
            meta.content = background;
        }
        (function () {
            // Apply the theme before first paint: the server-injected `THEME`
            // when configured, else the adaptive palette matching the OS scheme.
            const meta = document.querySelector('meta[name="nowplaying-theme"]');
            const configured = (meta && meta.content) || '';
            const name = configured || (
                window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'adaptive-light'
                    : 'adaptive-dark'
            );
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `themes/${name}.css`;
            link.id = 'theme-override';
            link.onload = () => syncThemeColor();
            document.head.appendChild(link);
        })();
        // Final catch-up once every stylesheet (style.css included) has applied.
        window.addEventListener('load', () => syncThemeColor());
        // Re-apply the caption colour whenever the window comes back: Chromium
        // leaves the inactive colour behind after a focus change (see above).
        window.addEventListener('focus', () => syncThemeColor(true));
        window.addEventListener('pageshow', () => syncThemeColor(true));
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) syncThemeColor(true);
        });
    </script>
</head>
<body>
    <audio id="session-audio" loop preload="auto" hidden></audio>
    <div class="card">
        <div class="header-container">
            <div class="header-title">
                <h1>Now Playing</h1>
                <button type="button" id="settings-btn" class="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Quick Settings" title="Quick Settings">
                    <svg class="settings-icon" aria-hidden="true"><use href="#icon-settings"/></svg>
                </button>
            </div>
            <div class="picker">
                <button type="button" id="sleep-btn" class="picker-btn" aria-haspopup="true" aria-controls="sleep-menu" aria-expanded="false" title="Sleep timer">
                    <svg class="picker-icon"><use href="#icon-sleep"/></svg>
                    <span id="sleep-label" class="picker-label"></span>
                </button>
                <div id="sleep-menu" class="picker-menu" role="radiogroup" aria-label="Sleep timer" hidden>
                    <label class="picker-option">
                        <input type="radio" name="sleep-mode" value="15">
                        <span>15 min</span>
                    </label>
                    <label class="picker-option">
                        <input type="radio" name="sleep-mode" value="30">
                        <span>30 min</span>
                    </label>
                    <label class="picker-option">
                        <input type="radio" name="sleep-mode" value="60">
                        <span>60 min</span>
                    </label>
                    <label class="picker-option">
                        <input type="radio" name="sleep-mode" value="end">
                        <span>End of song</span>
                    </label>
                    <label class="picker-option" id="sleep-off-option" hidden>
                        <input type="radio" name="sleep-mode" value="off">
                        <span>Off</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="main">
            <div class="cover">
                <img id="art" class="art" alt="Album art" src="cover.svg">
                <div id="feedback" class="feedback" hidden>
                    <button type="button" class="feedback-btn" data-score="1" title="Love this track" aria-label="Love this track" aria-pressed="false">
                        <svg class="feedback-icon" aria-hidden="true"><use href="#icon-thumbs-up"/></svg>
                    </button>
                    <button type="button" class="feedback-btn" data-score="-1" title="Hate this track" aria-label="Hate this track" aria-pressed="false">
                        <svg class="feedback-icon" aria-hidden="true"><use href="#icon-thumbs-down"/></svg>
                    </button>
                </div>
            </div>
            <div class="main-right">
                <div class="track">
                    <div id="track" class="track-text">Loading...</div>
                </div>
                <div class="spacer"></div>
                <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div><div class="progress-tip" id="progress-tip"></div></div>
                <div class="controls">
                    <button class="btn" data-action="previous" title="Previous">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">

                        </svg>

                        </svg>
                        <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M128,24A104,104,0,1,0,232,128,104.13,104.13,0,0,0,128,24ZM112,160a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm48,0a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Z"/>
                        </svg>
                    </button>
                    <button class="btn" data-action="next" title="Next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M208,40V216a8,8,0,0,1-16,0V146.77L72.43,221.55A15.95,15.95,0,0,1,48,208.12V47.88A15.95,15.95,0,0,1,72.43,34.45L192,109.23V40a8,8,0,0,1,16,0Z"/>
                        </svg>

        </div>

                <circle cx="128" cy="128" r="96" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <path d="M64,128a64,64,0,0,1,64-64" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <path d="M192,128a64,64,0,0,1-64,64" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>

                <line x1="208" y1="72" x2="80" y2="104" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <polyline points="80 196 80 56 208 24 208 164" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>

            <symbol id="icon-sleep" viewBox="0 0 256 256">

                <path d="M224,136c-4.07,49.28-45.67,88-96,88a96,96,0,0,1-96-96c0-50.33,38.72-91.93,88-96"

                    stroke-width="16" />
                <polyline points="128 72 128 128 184 128" fill="none" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
                <circle cx="160" cy="36" r="12" fill="currentColor" stroke="none" />
                <circle cx="196" cy="60" r="12" fill="currentColor" stroke="none" />
                <circle cx="220" cy="96" r="12" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="icon-thumbs-up" width="24" height="24" viewBox="0 0 256 256"><path d="M234,80.12A24,24,0,0,0,216,72H160V56a40,40,0,0,0-40-40,8,8,0,0,0-7.16,4.42L75.06,96H32a16,16,0,0,0-16,16v88a16,16,0,0,0,16,16H204a24,24,0,0,0,23.82-21l12-96A24,24,0,0,0,234,80.12ZM32,112H72v88H32ZM223.94,97l-12,96a8,8,0,0,1-7.94,7H88V105.89l36.71-73.43A24,24,0,0,1,144,56V80a8,8,0,0,0,8,8h64a8,8,0,0,1,7.94,9Z"></path></symbol>
            <symbol id="icon-thumbs-up-filled" width="24" height="24" viewBox="0 0 256 256"><path d="M234,80.12A24,24,0,0,0,216,72H160V56a40,40,0,0,0-40-40,8,8,0,0,0-7.16,4.42L75.06,96H32a16,16,0,0,0-16,16v88a16,16,0,0,0,16,16H204a24,24,0,0,0,23.82-21l12-96A24,24,0,0,0,234,80.12ZM32,112H72v88H32Z"></path></symbol>
            <symbol id="icon-thumbs-down" width="24" height="24" viewBox="0 0 256 256"><path d="M239.82,157l-12-96A24,24,0,0,0,204,40H32A16,16,0,0,0,16,56v88a16,16,0,0,0,16,16H75.06l37.78,75.58A8,8,0,0,0,120,240a40,40,0,0,0,40-40V184h56a24,24,0,0,0,23.82-27ZM72,144H32V56H72Zm150,21.29a7.88,7.88,0,0,1-6,2.71H152a8,8,0,0,0-8,8v24a24,24,0,0,1-19.29,23.54L88,150.11V56H204a8,8,0,0,1,7.94,7l12,96A7.87,7.87,0,0,1,222,165.29Z"></path></symbol>
            <symbol id="icon-thumbs-down-filled" width="24" height="24" viewBox="0 0 256 256"><path d="M239.82,157l-12-96A24,24,0,0,0,204,40H32A16,16,0,0,0,16,56v88a16,16,0,0,0,16,16H75.06l37.78,75.58A8,8,0,0,0,120,240a40,40,0,0,0,40-40V184h56a24,24,0,0,0,23.82-27ZM72,144H32V56H72Z"></path></symbol>
            <symbol id="icon-listenbrainz" width="24" height="24" viewBox="0 0 27 30">

                <path d="M40,88H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm64-24A16,16,0,1,1,88,80,16,16,0,0,1,104,64ZM216,168H199a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h97a32,32,0,0,0,62,0h17a8,8,0,0,0,0-16Zm-48,24a16,16,0,1,1,16-16A16,16,0,0,1,168,192Z"
                    fill="currentColor" stroke="none" />

    </div>
    <div id="settings-popup" class="settings-popup" hidden>
        <div class="settings-popup-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-popup-header">
                <span id="settings-title" class="settings-popup-title">Settings</span>
                <button type="button" id="settings-close" class="settings-close" aria-label="Close">✕</button>
            </div>
            <div class="settings-popup-body">
                <div class="settings-row">
                    <div>
                        <div class="settings-row-title">ListenBrainz submission</div>
                        <div class="settings-row-desc">Send listens to ListenBrainz once a track has played.</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" role="switch" aria-label="ListenBrainz submission" data-setting="LISTENBRAINZ_SUBMIT">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-row-title">Auto-skip</div>
                        <div class="settings-row-desc">Skip hated tracks (thumbs down) automatically.</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" role="switch" aria-label="Auto-skip" data-setting="AUTOSKIP">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-theme">
                    <div class="settings-row-title">Theme</div>
                    <select id="settings-theme" class="settings-theme-select"></select>
                </div>
            </div>
        </div>
    </div>
    <div id="review-popup" class="review-popup" hidden>
        <div class="review-popup-card" role="dialog" aria-modal="true" aria-labelledby="review-title">
            <div class="review-popup-header">
                <span id="review-title" class="review-popup-title"></span>
                <button type="button" id="review-close" class="review-close" aria-label="Close">✕</button>
            </div>
            <div id="review-body" class="review-popup-body"></div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            let hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController) {
                    hadController = true; // first install claimed this page
                    return;
                }
                window.location.reload();
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
        const source = new EventSource('/api/track/stream');
        window.addEventListener('DOMContentLoaded', () => {
            const trackEl = document.getElementById('track');
            const artEl = document.getElementById('art');
            const controls = document.querySelector('.controls');
            const progress = document.getElementById('progress');
            
            // Hide controls and progress initially until we know playerctl availability
            if (controls) {
                controls.hidden = true;
            }
            if (progress) {
                progress.hidden = true;
            }

            function add_span(el) {
                const span = document.createElement('span')
                span.className = 'centered';
                span.textContent = 'No metadata available';
                el.append(span);
            }

            source.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    data = null;
                }
                if (!data || data.error) {
                    lastRenderKey = null;
                    lastTrackData = null;
                    similarActive = false;
                    similarProbedId = null;
                    similarCheckSeq += 1; // drop an in-flight probe
                    if (data && data.error) {
                        trackEl.innerHTML = data.error;
                    } else {
                        add_span(trackEl);
                    }
                    artEl.src = 'cover.svg';
                    renderFeedback(null);
                    clearMediaSession();
                    return;
                }
                // A MusicBrainz recording id makes the track's ListenBrainz
                // similar-tracks lookup possible (see openSimilar below); what
                // it returns decides whether the title icon shows at all.
                currentMbid = typeof data.MBID === 'string' && data.MBID ? data.MBID : null;
                const id = data.TrackId;
                if (id !== lastTrackId) {
                    if (lastTrackId === null) {
                        progressActive = false;
                        // Fresh page load: SSE only replays a position event if one
                        // was recently published, so pull the stored position
                        // directly instead of starting at 0.
                        fetchPosition();
                    } else {
                        progressActive = true;
                        positionMs = 0;
                        lastTickTs = Date.now();
                    }
                    positionSynced = false;
                    lastTrackId = id;
                    // Unknown until the probes answer: both icons need real
                    // ListenBrainz rows before they show up.
                    similarActive = false;
                    similarCheckSeq += 1; // drop a probe started for the old track
                    similarProbedId = null; // the new track gets its own probe
                }
                if (currentMbid && id && id !== similarProbedId) {
                    similarProbedId = id;
                    void checkSimilar(id);
                }
                lastTrackData = data;
                durationMs = Number(data.Duration) || 0;
                renderFeedback(data);
                updateMediaSession(data);
                const art = data['Album Art'] || 'cover.svg';
                if (!artEl.src.endsWith(art)) {
                    artEl.src = art;
                }
                // Album art changed (or absent): re-apply an adaptive theme so
                // its palette follows the cover shown for the current track —
                // the server serves the neutral fallback for a no-art track.
                const artVersion = data['Album Art']?.split('?v=')[1] || null;
                if (ADAPTIVE_THEMES.has(currentTheme) && artVersion !== lastArtVersion) {
                    lastArtVersion = artVersion;
                    applyTheme(currentTheme, artVersion);
                }
                // Rebuild the track rows only when the rendered content changes;
                // SSE re-emits the current track on every reconnect.
                const renderKey = JSON.stringify([
                    data.Artist, data.Album, data.Title,
                    data.Loved, data.Hated, data.Review, data.Biography, data.MBID,
                ]);
                if (renderKey === lastRenderKey) {
                    playerctlAvailable = data.PlayerctlAvailable;
                    return;
                }
                lastRenderKey = renderKey;
                renderRows(data);
                playerctlAvailable = data.PlayerctlAvailable;
            };

            // Render the Artist / Album / Title rows for `data`. The ListenBrainz
            // icon only appears once a probe has confirmed there are similar
            // recordings to show: the Labs datasets have no row for many tracks
            // (a click would then open an empty dialog).
            function renderRows(data) {
                const similarTrack = similarActive;
                const rows = [
                    {
                        icon: data.Biography ? 'icon-info' : 'icon-user',
                        text: data.Artist,
                        biography: data.Biography,
                    },
                    ...(data.Album && data.Album !== data.Title
                        ? [{
                            icon: data.Review ? 'icon-info' : 'icon-disc',
                            text: data.Album,
                            review: data.Review,
                        }]
                        : []),
                    {
                        icon: similarTrack ? 'icon-listenbrainz' : 'icon-note',
                        text: data.Title,
                        popup: similarTrack ? 'recordings' : null,
                    },
                ];
                trackEl.innerHTML = '';
                rows.forEach(({ icon, text, review, biography, popup }) => {
                    const row = document.createElement('div');
                    row.className = 'track-row';
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.classList.add('track-icon');
                    if (review || biography) svg.classList.add('review');
                    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                    use.setAttribute('href', `#${icon}`);
                    svg.appendChild(use);
                    const value = document.createElement('span');
                    value.textContent = text;
                    row.append(svg, value);
                    if (review || biography) {
                        const content = biography || review;
                        row.classList.add('has-review');
                        row.title = biography
                            ? 'Read the artist biography'
                            : 'Read the album review';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openReview(
                                content,
                                biography
                                    ? `${data.Artist} - Biography`
                                    : `${data.Artist} - ${data.Album}`
                            );
                        });
                    } else if (popup === 'recordings') {
                        row.classList.add('has-similar');
                        row.title = 'Show similar tracks';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openSimilar(data.TrackId, `Similar to ${data.Artist} - ${data.Title}`);
                        });
                    }
                    trackEl.appendChild(row);
                });
                renderFeedback(data);
            }

            // One ListenBrainz probe per track change (not a poll): `limit=1` is
            // enough to learn whether the Labs datasets (or a rescued same-song
            // seed) have similar recordings for this track, and it warms the
            // server cache so opening the dialog is instant. A track no dataset
            // knows costs a chain walk plus the rescue, so the icon can pop in a
            // few seconds late; `similarCheckSeq` drops answers for a replaced
            // track.
            async function checkSimilar(trackId) {
                const seq = ++similarCheckSeq;
                let tracks;
                try {
                    const res = await fetch(`/api/track/${trackId}/similar?limit=1`);
                    if (!res.ok) return; // no MBID / API down: stay plain
                    const body = await res.json();
                    tracks = body && Array.isArray(body.Tracks) ? body.Tracks : [];
                } catch {
                    return; // offline: leave the plain note icon
                }
                if (seq !== similarCheckSeq || !tracks.length) return;
                similarActive = true;
                renderCurrentRows(trackId);
            }

            // Re-render the current track's rows after a probe answered.
            function renderCurrentRows(trackId) {
                if (lastTrackData && lastTrackData.TrackId === trackId) {
                    renderRows(lastTrackData);
                }
            }

            source.addEventListener('status', (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    return;
                }
                const active = typeof data.Status === 'string';
                playBtn.classList.toggle('playing', data.Status === 'Playing');
                playerctlAvailable = active;
                controls.hidden = !active;
                setMediaSessionState(
                    data.Status === 'Playing' ? 'playing' : active ? 'paused' : 'none'
                );
            });

            artEl.onerror = () => {
                if (artEl.src !== new URL('cover.svg', location.href).href) {
                    artEl.src = 'cover.svg';
                }
            };

            source.onerror = () => {
                if (!trackEl.innerText || trackEl.innerText === 'Loading...') {
                    trackEl.innerText = ''
                    add_span(trackEl);
                }
            };
        });

        // --- Theme ------------------------------------------------------------
        // Top level: the SSE handler (above, inside DOMContentLoaded) and the
        // settings modal (below) share the same theme state and switcher.
        const themeMeta = document.querySelector('meta[name="nowplaying-theme"]');
        const configuredTheme = (themeMeta && themeMeta.content) || '';
        const ADAPTIVE_THEMES = new Set(['adaptive-dark', 'adaptive-light']);
        const osLight = window.matchMedia('(prefers-color-scheme: light)');
        let currentTheme = configuredTheme
            || (osLight.matches ? 'adaptive-light' : 'adaptive-dark');
        let lastArtVersion = null;

        function applyTheme(name, version) {
            let link = document.getElementById('theme-override');
            if (!link) {
                link = document.createElement('link');
                link.rel = 'stylesheet';
                link.id = 'theme-override';
                document.head.appendChild(link);
            }
            const href = ADAPTIVE_THEMES.has(name) && version
                ? `themes/${name}.css?v=${version}`
                : `themes/${name}.css`;
            const url = new URL(href, location.href);
            // Re-sync the browser chrome color once the new sheet applies.
            link.onload = () => syncThemeColor();
            if (link.href !== url.href) {
                link.href = href;
            } else {
                syncThemeColor();
            }
            currentTheme = name;
        }

        // Follow OS light/dark only when no fixed theme is configured.
        if (!configuredTheme) {
            osLight.addEventListener('change', (e) => {
                const name = e.matches ? 'adaptive-light' : 'adaptive-dark';
                applyTheme(name, lastArtVersion);
            });
        }

        const playBtn = document.querySelector('.btn-play');

        let durationMs = 0;
        let positionMs = 0;
        let lastTickTs = Date.now();
        let lastTrackId = null;
        let progressActive = false;
        let playerctlAvailable = false;
        let positionSynced = false;
        let lastRenderKey = null;
        // Current track's MusicBrainz recording id (null when unresolved);
        // `similarSeq` invalidates in-flight ListenBrainz dialog fetches.
        let currentMbid = null;
        let similarSeq = 0;
        // Whether ListenBrainz has similar recordings for the current track (the
        // title row only becomes clickable once it does) and the last payload it
        // was rendered from, so the probe can re-render the rows when it answers.
        let similarActive = false;
        let similarProbedId = null;
        let similarCheckSeq = 0;
        let lastTrackData = null;
        const progressBar = document.getElementById('progress');
        const progressFill = document.getElementById('progress-fill');
        const progressTip = document.getElementById('progress-tip');

        function formatMs(ms) {
            const totalSec = Math.max(0, Math.floor(ms / 1000));
            const m = Math.floor(totalSec / 60);
            const s = String(totalSec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateProgressTip() {
            const label = durationMs ? `${formatMs(positionMs)} / ${formatMs(durationMs)}` : '';
            progressTip.textContent = label;
        }

        function updateProgress() {
            if (!durationMs || !playerctlAvailable || !positionSynced) {
                progressBar.hidden = true;
                return;
            }
            progressBar.hidden = false;
            const now = Date.now();
            if (progressActive && playBtn.classList.contains('playing')) {
                positionMs += now - lastTickTs;
            }
            lastTickTs = now;
            if (positionMs >= durationMs) {
                positionMs = durationMs;
                progressActive = false;
            }
            progressFill.style.width = (Math.min(1, positionMs / durationMs) * 100).toFixed(2) + '%';
            updateProgressTip();
            syncMediaSessionPosition();
        }

        async function fetchPosition() {
            try {
                const res = await fetch('/api/player/position');
                if (!res.ok) return;
                const data = await res.json();
                if (typeof data.Position !== 'number') return;
                positionMs = data.Position;
                lastTickTs = Date.now();
                progressActive = true;
                positionSynced = true;
            } catch {
                // ignore; SSE position events remain the live source
            }
        }

        async function sendControl(action) {
            if (action === 'play-pause') {
                playBtn.classList.toggle('playing');
                setMediaSessionState(
                    playBtn.classList.contains('playing') ? 'playing' : 'paused'
                );
            }
            if (action === 'previous') {
                positionMs = 0;
                lastTickTs = Date.now();
                progressActive = true;
            }
            try {
                await fetch(`/api/player/${action}`, { method: 'POST' });
            } catch {
                // ignore; playback state is reconciled by the next status event
            }
        }

        document.querySelectorAll('.btn').forEach((btn) => {
            btn.addEventListener('click', () => sendControl(btn.dataset.action));
        });

        // --- Love / hate ------------------------------------------------------
        // Two thumbs over the album art. A vote is stored in the local `feedback`
        // table and, with a ListenBrainz token, submitted as love/hate feedback.
        // The SSE change token includes the score, so every open client re-renders
        // the filled variant (the local DB is the only source of truth).
        const feedbackEl = document.getElementById('feedback');
        const thumbUp = feedbackEl.querySelector('.feedback-btn[data-score="1"]');
        const thumbDown = feedbackEl.querySelector('.feedback-btn[data-score="-1"]');

        function renderThumb(btn, pressed, kind) {
            const icon = pressed ? `icon-thumbs-${kind}-filled` : `icon-thumbs-${kind}`;
            btn.querySelector('use').setAttribute('href', `#${icon}`);
            btn.classList.toggle('active', pressed);
            btn.setAttribute('aria-pressed', String(pressed));
            // The label describes what a click does next (rate vs. withdraw).
            const label = kind === 'up'
                ? (pressed ? 'Remove love' : 'Love this track')
                : (pressed ? 'Remove hate' : 'Hate this track');
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        function renderFeedback(data) {
            const active = Boolean(data && data.TrackId);
            feedbackEl.hidden = !active;
            if (!active) return;
            renderThumb(thumbUp, Boolean(data.Loved), 'up');
            renderThumb(thumbDown, Boolean(data.Hated), 'down');
        }

        async function sendFeedback(score) {
            if (!lastTrackData || !lastTrackData.TrackId) return;
            const trackId = lastTrackData.TrackId;
            const previous = {
                Loved: Boolean(lastTrackData.Loved),
                Hated: Boolean(lastTrackData.Hated),
            };
            // Pressing the thumb that is already filled withdraws the vote; the
            // server mirrors this, so keep the optimistic state in step.
            const withdrawing = (score === 1 && previous.Loved)
                || (score === -1 && previous.Hated);
            lastTrackData = {
                ...lastTrackData,
                Loved: withdrawing ? false : score === 1,
                Hated: withdrawing ? false : score === -1,
            };
            renderFeedback(lastTrackData);
            try {
                const res = await fetch(`/api/feedback/${score}`, { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (lastTrackData && data.TrackId === lastTrackData.TrackId) {
                    lastTrackData = {
                        ...lastTrackData,
                        Loved: Boolean(data.Loved),
                        Hated: Boolean(data.Hated),
                    };
                    renderFeedback(lastTrackData);
                }
            } catch (err) {
                // Refused or offline: put the previous verdict back (unless the
                // stream already moved on to another track).
                if (lastTrackData && lastTrackData.TrackId === trackId) {
                    lastTrackData = { ...lastTrackData, ...previous };
                    renderFeedback(lastTrackData);
                }
                console.error('Failed to submit feedback:', err);
            }
        }

        for (const btn of [thumbUp, thumbDown]) {
            btn.addEventListener('click', () => {
                sendFeedback(Number(btn.dataset.score));
            });
        }

        // --- Sleep timer ------------------------------------------------------
        // The timer is server-owned (`POST /api/sleep/{mode}`) so it keeps
        // counting while the phone is asleep and survives a page reload; this
        // side only renders the state pushed over SSE.
        const sleepBtn = document.getElementById('sleep-btn');
        const sleepLabel = document.getElementById('sleep-label');
        const sleepMenu = document.getElementById('sleep-menu');
        const sleepOffOption = document.getElementById('sleep-off-option');
        const sleepRadios = [...sleepMenu.querySelectorAll('input[name="sleep-mode"]')];
        let sleepMode = null;
        let sleepEndsAt = null;

        function closeSleepMenu() {
            sleepMenu.hidden = true;
            sleepBtn.setAttribute('aria-expanded', 'false');
        }

        function toggleSleepMenu() {
            sleepMenu.hidden = !sleepMenu.hidden;
            sleepBtn.setAttribute('aria-expanded', String(!sleepMenu.hidden));
        }

        function formatSleepRemaining(ms) {
            const total = Math.max(0, Math.ceil(ms / 1000));
            return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
        }

        function renderSleep() {
            const armed = Boolean(sleepMode);
            sleepBtn.classList.toggle('armed', armed);
            sleepOffOption.hidden = !armed;
            for (const input of sleepRadios) {
                input.checked = input.value === sleepMode;
            }
            if (!armed) {
                sleepLabel.textContent = '';
                sleepBtn.title = 'Sleep timer';
                return;
            }
            if (sleepMode === 'end') {
                sleepLabel.textContent = 'End';
                sleepBtn.title = 'Sleep timer: end of song';
                return;
            }
            const remaining = sleepEndsAt ? sleepEndsAt - Date.now() : 0;
            sleepLabel.textContent = formatSleepRemaining(remaining);
            sleepBtn.title = `Sleep timer: ${formatSleepRemaining(remaining)}`;
        }

        function applySleepState(state) {
            sleepMode = state && state.Mode ? state.Mode : null;
            sleepEndsAt = state && typeof state.EndsAt === 'number' ? state.EndsAt : null;
            renderSleep();
        }

        async function setSleep(mode) {
            try {
                const res = await fetch(`/api/sleep/${mode}`, { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                applySleepState(await res.json());
            } catch (err) {
                console.error('Failed to set the sleep timer:', err);
            }
        }

        sleepBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSleepMenu();
        });

        for (const input of sleepRadios) {
            input.addEventListener('click', (e) => {
                if (input.value !== sleepMode || input.value === 'off') return;
                e.preventDefault();
                closeSleepMenu();
                void setSleep('off');
            });
        }

        sleepMenu.addEventListener('change', (e) => {
            const input = e.target.closest('input[name="sleep-mode"]');
            if (!input) return;
            closeSleepMenu();
            void setSleep(input.value);
        });

        document.addEventListener('click', (e) => {
            if (!sleepBtn.closest('.picker').contains(e.target)) closeSleepMenu();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (settingsPopup && !settingsPopup.hidden) closeSettings();
            else closeSleepMenu();
        });

        renderSleep();

        // --- Settings modal ------------------------------------------------------
        // Quick toggles (behaviour flags) + theme selector. Every change goes to
        // the server (`POST /api/settings`), which persists it to the project-root
        // `.env` - the ground truth - and applies it to the running config.
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPopup = document.getElementById('settings-popup');
        const settingsClose = document.getElementById('settings-close');
        const settingsThemeSelect = document.getElementById('settings-theme');
        const settingsSwitches = [...settingsPopup.querySelectorAll('.switch input[data-setting]')];
        let settingsThemes = [];
        let currentSettings = null;

        function renderSettings() {
            for (const input of settingsSwitches) {
                input.checked = Boolean(currentSettings && currentSettings[input.dataset.setting]);
            }
            // Submission is a no-op without a token, so that switch is disabled
            // (and its row dimmed) until LISTENBRAINZ_TOKEN is configured.
            const tokenReady = Boolean(currentSettings && currentSettings.LISTENBRAINZ_TOKEN);
            const submission = settingsSwitches.find(
                (input) => input.dataset.setting === 'LISTENBRAINZ_SUBMIT'
            );
            if (submission) {
                submission.disabled = !tokenReady;
                const row = submission.closest('.settings-row');
                if (row) {
                    row.classList.toggle('disabled', !tokenReady);
                    row.title = tokenReady
                        ? ''
                        : 'Set LISTENBRAINZ_TOKEN in .env to enable.';
                }
            }
        }

        function renderThemeOptions() {
            const current = (currentSettings && currentSettings.THEME) || currentTheme;
            const names = [...new Set([current, ...settingsThemes])];
            settingsThemeSelect.replaceChildren();
            for (const name of names) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                settingsThemeSelect.appendChild(option);
            }
            settingsThemeSelect.value = names.includes(current) ? current : '';
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                currentSettings = data.Settings || null;
                settingsThemes = Array.isArray(data.Themes) ? data.Themes : [];
                renderSettings();
                renderThemeOptions();
            } catch (err) {
                console.error('Failed to load settings:', err);
                const message = err instanceof Error ? err.message : '';
                renderThemeError(/^HTTP \d+$/.test(message) ? message : 'network error');
            }
        }

        // A missing/failing `/api/settings` (typically a web server older than
        // this page) must not leave an unexplained blank dropdown.
        function renderThemeError(detail) {
            settingsThemeSelect.replaceChildren();
            const option = document.createElement('option');
            option.value = '';
            option.textContent = `Couldn't load themes (${detail})`;
            option.disabled = true;
            settingsThemeSelect.appendChild(option);
            settingsThemeSelect.value = '';
        }

        async function setSetting(key, value) {
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [key]: value }),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                currentSettings = data.Settings || currentSettings;
                renderSettings();
                return true;
            } catch (err) {
                console.error(`Failed to set ${key}:`, err);
                return false;
            }
        }

        async function setTheme(name) {
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ THEME: name }),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                currentSettings = data.Settings || currentSettings;
                // Hot-swap the sheet client-side; the server keeps the theme in .env.
                const meta = document.querySelector('meta[name="nowplaying-theme"]');
                if (meta) meta.content = name;
                applyTheme(name, lastArtVersion);
                renderThemeOptions();
            } catch (err) {
                console.error('Failed to set theme:', err);
                // Snap the selector back to the last known-good theme.
                renderThemeOptions();
            }
        }

        function openSettings() {
            closeSleepMenu();
            settingsPopup.hidden = false;
            document.body.classList.add('no-scroll');
            settingsBtn.setAttribute('aria-expanded', 'true');
            void loadSettings();
        }

        function closeSettings() {
            settingsPopup.hidden = true;
            document.body.classList.remove('no-scroll');
            settingsBtn.setAttribute('aria-expanded', 'false');
        }

        settingsBtn.addEventListener('click', () => {
            if (settingsPopup.hidden) openSettings();
            else closeSettings();
        });
        settingsClose.addEventListener('click', closeSettings);
        settingsPopup.addEventListener('click', (e) => {
            if (e.target === settingsPopup) closeSettings();
        });
        settingsThemeSelect.addEventListener('change', (e) => {
            void setTheme(e.target.value);
        });
        for (const input of settingsSwitches) {
            input.addEventListener('change', () => {
                void setSetting(input.dataset.setting, input.checked).then((ok) => {
                    // A rejected change snaps the native checkbox back to server state.
                    if (!ok) renderSettings();
                });
            });
        }

        // --- Media Session API ----------------------------------------------
        // Publishes the track to the OS (lock screen, media keys, Bluetooth
        // headset buttons, the Windows SMTC overlay) and routes the OS controls
        // through the same `sendControl()` the dashboard buttons use, so a
        // media key press and a click are indistinguishable server-side.
        const mediaSession = 'mediaSession' in navigator ? navigator.mediaSession : null;
        // The silent keep-alive element (see `keepSessionAlive` further down).
        const sessionAudio = document.getElementById('session-audio');
        // Chromium only accepts raster artwork for the session, so the SVG
        // placeholder is never advertised - the PWA icon stands in instead.
        const MEDIA_ART_FALLBACK = new URL('icon/512.png', location.href).href;
        // Skip reassigning identical metadata: the SSE stream re-emits the
        // current track on every reconnect and the OS would re-render the card.
        let mediaSessionKey = null;
        // Whether real playback is happening right now; gates the silent
        // keep-alive stream, so the OS card exists only while music plays.
        let mediaSessionWanted = false;

        function absoluteUrl(url) {
            try {
                return new URL(url, location.href).href;
            } catch {
                return MEDIA_ART_FALLBACK;
            }
        }

        function setMediaSessionState(state) {
            if (!mediaSession) return;
            try {
                mediaSession.playbackState = state;
            } catch {
                // unsupported state value; the status event retries on change
            }
            mediaSessionWanted = state === 'playing';
            if (mediaSessionWanted) {
                // Real playback started: (re)open the OS session.
                keepSessionAlive();
            } else if (!sessionAudio.paused) {
                // Nothing is playing: drop the silent stream so the OS card
                // disappears instead of lingering in a paused state.
                sessionAudio.pause();
            }
        }

        function updateMediaSession(data) {
            if (!mediaSession || !data) return;
            const key = JSON.stringify([data.Title, data.Artist, data.Album, data['Album Art']]);
            if (key === mediaSessionKey) return;
            mediaSessionKey = key;
            const artwork = data['Album Art'] ? absoluteUrl(data['Album Art']) : MEDIA_ART_FALLBACK;
            try {
                mediaSession.metadata = new MediaMetadata({
                    title: data.Title || 'Unknown Title',
                    artist: data.Artist || 'Unknown Artist',
                    album: data.Album || '',
                    artwork: [{ src: artwork, sizes: '512x512', type: 'image/png' }],
                });
            } catch {
                // MediaMetadata unavailable: leave the OS display untouched
            }
        }

        function clearMediaSession() {
            if (!mediaSession) return;
            mediaSessionKey = null;
            mediaSession.metadata = null;
            try {
                mediaSession.setPositionState(null);
            } catch {
                // already cleared
            }
            setMediaSessionState('none');
        }

        // Feed the OS scrubber; the browser rejects a state without a positive
        // duration, so this only runs once a duration is known.
        function syncMediaSessionPosition() {
            if (!mediaSession) return;
            try {
                mediaSession.setPositionState({
                    duration: durationMs / 1000,
                    position: Math.min(positionMs, durationMs) / 1000,
                    playbackRate: 1,
                });
            } catch {
                // invalid state (no duration yet); updateProgress retries
            }
        }

        if (mediaSession) {
            const actions = {
                // `play`/`pause` are the OS asking for a specific direction; the
                // player only exposes a toggle, so no-op when already there.
                play: () => {
                    if (!playBtn.classList.contains('playing')) sendControl('play-pause');
                },
                pause: () => {
                    if (playBtn.classList.contains('playing')) sendControl('play-pause');
                },
                previoustrack: () => sendControl('previous'),
                nexttrack: () => sendControl('next'),
            };
            for (const [action, handler] of Object.entries(actions)) {
                try {
                    mediaSession.setActionHandler(action, handler);
                } catch {
                    // action unsupported by this browser
                }
            }
        }

        // Chromium (Edge/Chrome) only hands a page's Media Session to the OS -
        // the Windows media flyout, the lock screen, the SMTC overlay - while a
        // media *element* is actually playing
        let sessionAudioBlocked = true;

        function silentWav(seconds = 10, rate = 8000) {
            const samples = seconds * rate;
            const buffer = new ArrayBuffer(44 + samples);
            const view = new DataView(buffer);
            const ascii = (offset, text) => {
                for (let i = 0; i < text.length; i += 1) {
                    view.setUint8(offset + i, text.charCodeAt(i));
                }
            };
            ascii(0, 'RIFF');
            view.setUint32(4, 36 + samples, true);
            ascii(8, 'WAVE');
            ascii(12, 'fmt ');
            view.setUint32(16, 16, true); // fmt chunk size
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // mono
            view.setUint32(24, rate, true);
            view.setUint32(28, rate, true); // byte rate (8-bit mono)
            view.setUint16(32, 1, true); // block align
            view.setUint16(34, 8, true); // bits per sample
            ascii(36, 'data');
            view.setUint32(40, samples, true);
            // 8-bit PCM silence is 0x80 (0x00 is full negative DC, i.e. a thump).
            new Uint8Array(buffer, 44).fill(0x80);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function keepSessionAlive() {
            if (!mediaSession || !mediaSessionWanted || !sessionAudio.paused) return;
            sessionAudio.play().then(
                () => {
                    sessionAudioBlocked = false;
                },
                () => {
                    sessionAudioBlocked = true;
                }
            );
        }

        sessionAudio.src = URL.createObjectURL(silentWav());
        for (const type of ['pointerdown', 'keydown', 'touchstart']) {
            document.addEventListener(
                type,
                () => {
                    if (sessionAudioBlocked) keepSessionAlive();
                },
                { passive: true }
            );
        }
        window.addEventListener('focus', keepSessionAlive);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) keepSessionAlive();
        });

        setInterval(updateProgress, 1000);
        setInterval(renderSleep, 1000);

        // Server-pushed sleep timer state: the countdown is derived from
        // `EndsAt` locally, so the stream only fires on arm / cancel / expiry.
        source.addEventListener('sleep', (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }
            applySleepState(data);
        });

        source.addEventListener('position', (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }
            if (typeof data.Position !== 'number') {
                return;
            }
            positionMs = data.Position;
            lastTickTs = Date.now();
            progressActive = true;
            positionSynced = true;
        });

        function renderMarkdown(text) {
            const esc = (s) =>
                s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const inline = (s) =>
                s
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, label, url) => {
                        let u;
                        try {
                            u = new URL(url, location.href);
                        } catch {
                            return label;
                        }
                        if (u.protocol !== 'http:' && u.protocol !== 'https:') return label;
                        return `<a href="${u.href}" target="_blank" rel="noreferrer noopener">${label}</a>`;
                    })
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>');
            const out = [];
            let inList = false;
            let inQuote = false;
            const flush = () => {
                if (inList) { out.push('</ul>'); inList = false; }
                if (inQuote) { out.push('</blockquote>'); inQuote = false; }
            };
            for (const raw of text.split('\n')) {
                const line = raw.trim();
                if (!line) { flush(); continue; }
                const h1 = line.match(/^###\s+(.*)$/);
                const h2 = line.match(/^##\s+(.*)$/);
                const h3 = line.match(/^#\s+(.*)$/);
                if (h1 || h2 || h3) {
                    flush();
                    const tag = h1 ? 'h3' : h2 ? 'h4' : 'h5';
                    out.push(`<${tag}>${inline(esc((h1 || h2 || h3)[1]))}</${tag}>`);
                    continue;
                }
                if (line.startsWith('- ')) {
                    if (!inList) { out.push('<ul>'); inList = true; }
                    out.push(`<li>${inline(esc(line.slice(2)))}</li>`);
                    continue;
                }
                if (line.startsWith('> ')) {
                    if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
                    out.push(`<p>${inline(esc(line.slice(2)))}</p>`);
                    continue;
                }
                flush();
                out.push(`<p>${inline(esc(line))}</p>`);
            }
            flush();
            return out.join('\n');
        }

        const popup = document.getElementById('review-popup');
        const popupCard = document.querySelector('.review-popup-card');
        const popupTitle = document.getElementById('review-title');
        const popupBody = document.getElementById('review-body');
        const popupClose = document.getElementById('review-close');

        const SIMILAR_LIMIT = 12;

        function resetPopupMode() {
            popupCard.classList.remove('wide');
            popupBody.classList.remove('popup-table');
        }

        function openReview(review, title) {
            similarSeq += 1; // drop any in-flight similar-tracks fetch
            resetPopupMode();
            popupTitle.textContent = title;
            popupBody.innerHTML = renderMarkdown(review);
            popup.hidden = false;
            document.body.classList.add('no-scroll');
        }

        function closeReview() {
            similarSeq += 1; // drop any in-flight similar-tracks fetch
            popup.hidden = true;
            popupBody.innerHTML = '';
            resetPopupMode();
            document.body.classList.remove('no-scroll');
        }

        function statusLine(text) {
            const p = document.createElement('p');
            p.className = 'popup-status';
            p.textContent = text;
            return p;
        }

        // Build a table row by row (never from a rendered string) so titles and
        // albums can't inject markup.

        const MBID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

        function listenbrainzUrl(mbid, kind) {
            return typeof mbid === 'string' && MBID_RE.test(mbid)
                ? `https://listenbrainz.org/${kind}/${mbid}/`
                : null;
        }

        function buildTable(headers, className) {
            const table = document.createElement('table');
            table.className = className ? `similar-table ${className}` : 'similar-table';
            const row = table.createTHead().insertRow();
            for (const [label, cellClass] of headers) {
                const th = document.createElement('th');
                th.textContent = label;
                if (cellClass) th.className = cellClass;
                row.appendChild(th);
            }
            table.createTBody();
            return table;
        }

        // A row (and its name anchor) opens `url`; the anchor keeps the row
        // keyboard accessible and handles the modifier/middle clicks a row can't.
        // An empty label stays plain text - an anchor without text is invisible
        // but still focusable.
        function linkCell(cell, text, url, title) {
            if (!url || !text) {
                cell.textContent = text;
                return;
            }
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noreferrer noopener';
            if (title) link.title = title;
            link.textContent = text;
            cell.appendChild(link);
        }

        // Similar tracks: ListenBrainz Labs' co-listening score per recording.
        function buildSimilarTable(tracks) {
            const table = buildTable([
                ['', ''], ['Artist', ''], ['Title', ''],
                ['Album', ''], ['Match', 'num'],
            ]);
            const body = table.tBodies[0];
            tracks.forEach((track) => {
                const row = body.insertRow();
                const art = row.insertCell();
                if (typeof track.Cover === 'string' && track.Cover.startsWith('https://')) {
                    const img = document.createElement('img');
                    img.className = 'similar-cover';
                    img.src = track.Cover;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.addEventListener('error', () => img.remove());
                    art.appendChild(img);
                }
                const url = listenbrainzUrl(track.ArtistMBID, 'artist');
                const artistCell = row.insertCell();
                linkCell(artistCell, track.Artist || '', url);
                // The title points at the recording itself on ListenBrainz.
                const trackUrl = listenbrainzUrl(track.MBID, 'recording');
                const titleCell = row.insertCell();
                linkCell(
                    titleCell,
                    track.Title || '',
                    trackUrl,
                    'Open the recording on ListenBrainz'
                );
                row.insertCell().textContent = track.Album || '';
                const score = row.insertCell();
                score.className = 'num';
                score.textContent = typeof track.Score === 'number'
                    ? track.Score.toLocaleString()
                    : '';
                if (url) {
                    row.classList.add('linked');
                    row.title = 'Open the artist on ListenBrainz';
                    row.addEventListener('click', (event) => {
                        if (event.target.closest('a')) return;
                        window.open(url, '_blank', 'noopener');
                    });
                }
            });
            return table;
        }

        // Shared dialog loader: opens the wide table popup, fetches `url`, and
        // renders `data[field]` with `build`. `similarSeq` invalidates a fetch
        // whose popup has since been replaced.
        async function loadPopupTable({ label, url, field, noun, build, empty }) {
            const seq = ++similarSeq;
            resetPopupMode();
            popupCard.classList.add('wide');
            popupBody.classList.add('popup-table');
            popupTitle.textContent = label;
            popupBody.replaceChildren(statusLine('Searching ListenBrainz…'));
            popup.hidden = false;
            document.body.classList.add('no-scroll');

            let data;
            try {
                const res = await fetch(url);
                if (seq !== similarSeq) return;
                if (!res.ok) {
                    let detail = `HTTP ${res.status}`;
                    try {
                        const body = await res.json();
                        if (body && body.detail) detail = body.detail;
                    } catch {
                        // non-JSON error body; keep the status text
                    }
                    popupBody.replaceChildren(statusLine(`Could not load ${noun}: ${detail}`));
                    return;
                }
                data = await res.json();
            } catch {
                if (seq === similarSeq) {
                    popupBody.replaceChildren(statusLine('Could not reach ListenBrainz.'));
                }
                return;
            }
            if (seq !== similarSeq) return;

            const rows = data && Array.isArray(data[field]) ? data[field] : [];
            popupBody.replaceChildren(rows.length ? build(rows) : statusLine(empty));
        }

        // Similar recordings for the current track (seeded on its MusicBrainz
        // recording id; the server caches them for an hour).
        function openSimilar(trackId, label) {
            if (!trackId) return;
            return loadPopupTable({
                label,
                url: `/api/track/${trackId}/similar?limit=${SIMILAR_LIMIT}`,
                field: 'Tracks',
                noun: 'similar tracks',
                build: buildSimilarTable,
                empty: 'No similar tracks found for this track yet.',
            });
        }

        popupClose.addEventListener('click', closeReview);
        popup.addEventListener('click', (e) => {
            if (e.target === popup) closeReview();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !popup.hidden) closeReview();
        });
    </script>
</body>
</html>

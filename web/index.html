<!DOCTYPE html>
<html>
<head>
    <title>Now Playing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1D2021">
    <meta name="description" content="Now Playing - live track metadata from any media app.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="favicon">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            // Apply the theme before first paint: user choice, else the OS scheme.
            let name = localStorage.getItem('theme');
            if (!name || !/^[a-z0-9-]+$/i.test(name)) {
                name = window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'adaptive-light'
                    : 'adaptive-dark';
            }
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `themes/${name}.css`;
            link.id = 'theme-override';
            document.head.appendChild(link);
        })();
    </script>
</head>
<body>
    <div class="card">
        <div class="header-container">
            <h1>Now Playing</h1>
            <div class="theme">
                <div class="theme-picker">
                    <button type="button" id="theme-btn" class="theme-btn" aria-haspopup="listbox" aria-expanded="false" title="Theme">
                        <span id="theme-dot" class="theme-dot">⬤</span>
                    </button>
                    <ul id="theme-menu" class="theme-menu" role="listbox" hidden></ul>
                </div>
            </div>
        </div>
        <div class="main">
            <div class="cover">
                <img id="art" class="art" alt="Album art" src="cover.svg">
            </div>
            <div class="main-right">
                <div class="track">
                    <div id="track" class="track-text">Loading...</div>
                </div>
                <div class="spacer"></div>
                <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div><div class="progress-tip" id="progress-tip"></div></div>
                <div class="controls">
                    <button class="btn" data-action="previous" title="Previous">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88Z"/>
                        </svg>
                    </button>
                    <button class="btn btn-play" data-action="play-pause" title="Play / Pause">
                        <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm40.55,110.58-52,36A8,8,0,0,1,104,164V92a8,8,0,0,1,12.55-6.58l52,36a8,8,0,0,1,0,13.16Z"/>
                        </svg>
                        <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M128,24A104,104,0,1,0,232,128,104.13,104.13,0,0,0,128,24ZM112,160a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Zm48,0a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Z"/>
                        </svg>
                    </button>
                    <button class="btn" data-action="next" title="Next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                            <rect width="256" height="256"/>
                            <path d="M208,40V216a8,8,0,0,1-16,0V146.77L72.43,221.55A15.95,15.95,0,0,1,48,208.12V47.88A15.95,15.95,0,0,1,72.43,34.45L192,109.23V40a8,8,0,0,1,16,0Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <svg class="icon-stroke" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="display:none">
            <symbol id="icon-user" width="24" height="24" viewBox="0 0 256 256"><rect width="256" height="256" stroke="none"/>
                <circle cx="128" cy="96" r="64" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <path d="M32,216c19.37-33.47,54.55-56,96-56s76.63,22.53,96,56" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
            </symbol>
            <symbol id="icon-disc" width="24" height="24" viewBox="0 0 256 256"><rect width="256" height="256" stroke="none"/>
                <circle cx="128" cy="128" r="96" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <path d="M64,128a64,64,0,0,1,64-64" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <path d="M192,128a64,64,0,0,1-64,64" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <circle cx="128" cy="128" r="24" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
            </symbol>
            <symbol id="icon-review" width="24" height="24" viewBox="0 0 256 256">
                <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-4,48a12,12,0,1,1-12,12A12,12,0,0,1,124,72Zm12,112a16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40a8,8,0,0,1,0,16Z"/>
            </symbol>
            <symbol id="icon-note" width="24" height="24" viewBox="0 0 256 256"><rect width="256" height="256" stroke="none"/>
                <circle cx="180" cy="164" r="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <circle cx="52" cy="196" r="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <line x1="208" y1="72" x2="80" y2="104" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                <polyline points="80 196 80 56 208 24 208 164" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
            </symbol>
            <symbol id="icon-love" width="24" height="24" viewBox="0 0 256 256"><rect width="256" height="256" fill="none" stroke="none"/>
                <path d="M240,102c0,70-103.79,126.66-108.21,129a8,8,0,0,1-7.58,0C119.79,228.66,16,172,16,102A62.07,62.07,0,0,1,78,40c20.65,0,38.73,8.88,50,23.89C139.27,48.88,157.35,40,178,40A62.07,62.07,0,0,1,240,102Z"/>
            </symbol>
            <symbol id="icon-listenbrainz" width="24" height="24" viewBox="0 0 27 30">
                <polygon fill="#353070" stroke="none" points="13 1 1 8 1 22 13 29 13 1"/>
                <polygon fill="#eb743b" stroke="none" points="14 1 26 8 26 22 14 29 14 1"/>
            </symbol>
        </svg>
    </div>
    <div id="review-popup" class="review-popup" hidden>
        <div class="review-popup-card" role="dialog" aria-modal="true" aria-labelledby="review-title">
            <div class="review-popup-header">
                <span id="review-title" class="review-popup-title"></span>
                <button type="button" id="review-close" class="review-close" aria-label="Close">✕</button>
            </div>
            <div id="review-body" class="review-popup-body"></div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
        const source = new EventSource('/api/track/stream');
        window.addEventListener('DOMContentLoaded', () => {
            const trackEl = document.getElementById('track');
            const artEl = document.getElementById('art');
            const themeBtn = document.getElementById('theme-btn');
            const themeDot = document.getElementById('theme-dot');
            const themeMenu = document.getElementById('theme-menu');
            const controls = document.querySelector('.controls');
            const progress = document.getElementById('progress');
            
            // Hide controls and progress initially until we know playerctl availability
            if (controls) {
                controls.hidden = true;
            }
            if (progress) {
                progress.hidden = true;
            }

            // Restore a saved theme if the user picked one; otherwise follow the
            // OS color scheme (adaptive-dark / adaptive-light) while unpicked.
            const savedTheme = localStorage.getItem('theme') || '';
            // Whether a theme was explicitly picked (persisted) — saved at load
            // or during this session; OS scheme changes must not stomp a pick.
            let userPicked = Boolean(savedTheme);
            // Adaptive themes are generated server-side from the album cover;
            // they are re-fetched (cache-busted by the cover version) on change.
            const ADAPTIVE_THEMES = new Set(['adaptive-dark', 'adaptive-light']);
            const osLight = window.matchMedia('(prefers-color-scheme: light)');
            const defaultSaved = osLight.matches ? 'adaptive-light' : 'adaptive-dark';
            let currentTheme = savedTheme || defaultSaved;
            let lastArtVersion = null;
            // Latest `accent` per theme from `/api/themes` (adaptive entries are
            // regenerated per album, so this map is refreshed on cover changes).
            const themeAccents = new Map();

            function themeLabel(name) {
                return name
                    .split('-')
                    .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            function applyTheme(name, version, persist = true) {
                let link = document.getElementById('theme-override');
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.id = 'theme-override';
                    document.head.appendChild(link);
                }
                const href = ADAPTIVE_THEMES.has(name) && version
                    ? `themes/${name}.css?v=${version}`
                    : `themes/${name}.css`;
                const url = new URL(href, location.href);
                if (link.href !== url.href) {
                    link.href = href;
                }
                currentTheme = name;
                if (persist) {
                    localStorage.setItem('theme', name);
                }
            }

            function closeMenu() {
                themeMenu.hidden = true;
                themeBtn.setAttribute('aria-expanded', 'false');
            }

            function toggleMenu() {
                themeMenu.hidden = !themeMenu.hidden;
                themeBtn.setAttribute('aria-expanded', String(!themeMenu.hidden));
            }

            function setThemeDot(accent) {
                themeDot.style.color = accent || 'var(--accent-color)';
            }

            function selectTheme(name, accent, persist = true) {
                applyTheme(name, ADAPTIVE_THEMES.has(name) ? lastArtVersion : null, persist);
                userPicked = persist;
                setThemeDot(accent);
                themeBtn.title = themeLabel(name);
                themeMenu.querySelectorAll('li').forEach((li) => {
                    li.classList.toggle('selected', li.dataset.theme === name);
                });
            }

            function collectThemes(themes) {
                themeMenu.innerHTML = '';
                for (const item of themes) {
                    const name = typeof item === 'string' ? item : item && item.name;
                    if (!name) continue;
                    const accent = (item && item.accent) || null;
                    themeAccents.set(name, accent);
                    const li = document.createElement('li');
                    li.dataset.theme = name;
                    li.role = 'option';
                    const dot = document.createElement('span');
                    dot.className = 'menu-dot';
                    dot.textContent = '⬤';
                    dot.style.color = accent || 'var(--accent-color)';
                    const label = document.createElement('span');
                    label.textContent = themeLabel(name);
                    li.append(dot, label);
                    li.addEventListener('click', () => {
                        selectTheme(name, themeAccents.get(name) || null);
                        closeMenu();
                    });
                    themeMenu.appendChild(li);
                }
            }

            async function loadThemes() {
                try {
                    const res = await fetch('/api/themes');
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const themes = await res.json();
                    if (!Array.isArray(themes)) throw new Error('Unexpected response');
                    collectThemes(themes);
                    selectTheme(currentTheme, themeAccents.get(currentTheme) || null, Boolean(savedTheme));
                } catch (err) {
                    console.error('Failed to load themes:', err);
                    themeBtn.disabled = true;
                }
            }

            // Re-read the generated accent (the adaptive palette follows the
            // cover) and refresh the picker dot + menu swatches in place.
            async function refreshThemeAccents() {
                try {
                    const res = await fetch('/api/themes');
                    if (!res.ok) return;
                    const themes = await res.json();
                    if (!Array.isArray(themes)) return;
                    for (const item of themes) {
                        const name = typeof item === 'string' ? item : item && item.name;
                        if (!name) continue;
                        const accent = (item && item.accent) || null;
                        themeAccents.set(name, accent);
                        const li = themeMenu.querySelector(`li[data-theme="${name}"]`);
                        const dot = li && li.querySelector('.menu-dot');
                        if (dot) dot.style.color = accent || 'var(--accent-color)';
                    }
                    if (ADAPTIVE_THEMES.has(currentTheme)) {
                        setThemeDot(themeAccents.get(currentTheme) || null);
                    }
                } catch (err) {
                    console.error('Failed to refresh theme accents:', err);
                }
            }

            loadThemes();

            themeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            document.addEventListener('click', (e) => {
                if (!themeBtn.closest('.theme-picker').contains(e.target)) {
                    closeMenu();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });

            // Follow OS light/dark while no theme was explicitly picked
            // (this session or a previous one).
            osLight.addEventListener('change', (e) => {
                if (!userPicked) {
                    const name = e.matches ? 'adaptive-light' : 'adaptive-dark';
                    selectTheme(name, themeAccents.get(name) || null, false);
                }
            });

            function add_span(el) {
                const span = document.createElement('span')
                span.className = 'centered';
                span.textContent = 'No metadata available';
                el.append(span);
            }

            source.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    data = null;
                }
                if (!data || data.error) {
                    lastRenderKey = null;
                    lastTrackData = null;
                    similarActive = false;
                    similarArtistsActive = false;
                    similarProbedId = null;
                    similarCheckSeq += 1; // drop an in-flight probe
                    similarArtistCheckSeq += 1;
                    if (data && data.error) {
                        trackEl.innerHTML = data.error;
                    } else {
                        add_span(trackEl);
                    }
                    artEl.src = 'cover.svg';
                    return;
                }
                // A MusicBrainz recording id makes the track's ListenBrainz
                // lookups possible (see openSimilar / openSimilarArtists below);
                // what they return decides whether the icons show at all.
                currentMbid = typeof data.MBID === 'string' && data.MBID ? data.MBID : null;
                const id = data.TrackId;
                if (id !== lastTrackId) {
                    if (lastTrackId === null) {
                        progressActive = false;
                        // Fresh page load: SSE only replays a position event if one
                        // was recently published, so pull the stored position
                        // directly instead of starting at 0.
                        fetchPosition();
                    } else {
                        progressActive = true;
                        positionMs = 0;
                        lastTickTs = Date.now();
                    }
                    positionSynced = false;
                    lastTrackId = id;
                    // Unknown until the probes answer: both icons need real
                    // ListenBrainz rows before they show up.
                    similarActive = false;
                    similarArtistsActive = false;
                    similarCheckSeq += 1; // drop a probe started for the old track
                    similarArtistCheckSeq += 1;
                    similarProbedId = null; // the new track gets its own probes
                }
                if (currentMbid && id && id !== similarProbedId) {
                    similarProbedId = id;
                    void checkSimilar(id);
                    void checkSimilarArtists(id);
                }
                lastTrackData = data;
                durationMs = Number(data.Duration) || 0;
                const art = data['Album Art'] || 'cover.svg';
                if (!artEl.src.endsWith(art)) {
                    artEl.src = art;
                }
                // Album art changed (or absent): re-apply an adaptive theme so
                // its palette follows the cover shown for the current track —
                // the server serves the neutral fallback for a no-art track.
                const artVersion = data['Album Art']?.split('?v=')[1] || null;
                if (ADAPTIVE_THEMES.has(currentTheme) && artVersion !== lastArtVersion) {
                    lastArtVersion = artVersion;
                    applyTheme(currentTheme, artVersion, false);
                    // The palette (and thus the picker dot) follows the cover.
                    refreshThemeAccents();
                }
                // Rebuild the track rows only when the rendered content changes;
                // SSE re-emits the current track on every reconnect.
                const renderKey = JSON.stringify([
                    data.Artist, data.Album, data.Title,
                    data.Loved, data.Review, data.MBID,
                ]);
                if (renderKey === lastRenderKey) {
                    playerctlAvailable = data.PlayerctlAvailable;
                    return;
                }
                lastRenderKey = renderKey;
                renderRows(data);
                playerctlAvailable = data.PlayerctlAvailable;
            };

            // Render the Artist / Album / Title rows for `data`. Both ListenBrainz
            // icons only appear once a probe has confirmed there is something to
            // show: the Labs datasets have no row for many tracks and LB Radio's
            // artist pool is empty for many artists (a click would then open an
            // empty dialog).
            function renderRows(data) {
                const similarArtist = similarArtistsActive;
                const similarTrack = similarActive;
                const rows = [
                    {
                        icon: similarArtist ? 'icon-listenbrainz' : 'icon-user',
                        text: data.Artist,
                        popup: similarArtist ? 'artists' : null,
                    },
                    ...(data.Album && data.Album !== data.Title
                        ? [{
                            icon: data.Review ? 'icon-review' : 'icon-disc',
                            text: data.Album,
                            review: data.Review,
                        }]
                        : []),
                    {
                        icon: similarTrack
                            ? 'icon-listenbrainz'
                            : (data.Loved ? 'icon-love' : 'icon-note'),
                        text: data.Title,
                        loved: data.Loved && !similarTrack,
                        popup: similarTrack ? 'recordings' : null,
                    },
                ];
                trackEl.innerHTML = '';
                rows.forEach(({ icon, text, loved, review, popup }) => {
                    const row = document.createElement('div');
                    row.className = 'track-row';
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.classList.add('track-icon');
                    if (loved) svg.classList.add('heart');
                    if (review) svg.classList.add('review');
                    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                    use.setAttribute('href', `#${icon}`);
                    svg.appendChild(use);
                    const value = document.createElement('span');
                    value.textContent = text;
                    row.append(svg, value);
                    if (review) {
                        row.classList.add('has-review');
                        row.title = 'Read the album review';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openReview(review, `${data.Artist} - ${data.Album}`);
                        });
                    } else if (popup === 'artists') {
                        row.classList.add('has-similar');
                        row.title = 'Show similar artists';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openSimilarArtists(data.TrackId, `Similar to ${data.Artist}`);
                        });
                    } else if (popup === 'recordings') {
                        row.classList.add('has-similar');
                        row.title = 'Show similar tracks';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openSimilar(data.TrackId, `Similar to ${data.Artist} - ${data.Title}`);
                        });
                    }
                    trackEl.appendChild(row);
                });
            }

            // One ListenBrainz probe per track change (not a poll): `limit=1` is
            // enough to learn whether the Labs datasets (or a rescued same-song
            // seed) have similar recordings for this track, and it warms the
            // server cache so opening the dialog is instant. A track no dataset
            // knows costs a chain walk plus the rescue, so the icon can pop in a
            // few seconds late; `similarCheckSeq` drops answers for a replaced
            // track.
            async function checkSimilar(trackId) {
                const seq = ++similarCheckSeq;
                let tracks;
                try {
                    const res = await fetch(`/api/track/${trackId}/similar?limit=1`);
                    if (!res.ok) return; // no MBID / API down: stay plain
                    const body = await res.json();
                    tracks = body && Array.isArray(body.Tracks) ? body.Tracks : [];
                } catch {
                    return; // offline: leave the plain note icon
                }
                if (seq !== similarCheckSeq || !tracks.length) return;
                similarActive = true;
                renderCurrentRows(trackId);
            }

            // The same probe for LB Radio's artist pool: many artists have no
            // similar ones, so the artist row only becomes clickable once the
            // pool is known to hold at least one artist. The pool is resolved
            // from the recording's artist, so this costs a metadata lookup plus
            // the pool call (both cached server-side for an hour).
            async function checkSimilarArtists(trackId) {
                const seq = ++similarArtistCheckSeq;
                let artists;
                try {
                    const res = await fetch(`/api/track/${trackId}/similar-artists?limit=1`);
                    if (!res.ok) return; // no MBID / API down: stay plain
                    const body = await res.json();
                    artists = body && Array.isArray(body.Artists) ? body.Artists : [];
                } catch {
                    return; // offline: leave the plain artist icon
                }
                if (seq !== similarArtistCheckSeq || !artists.length) return;
                similarArtistsActive = true;
                renderCurrentRows(trackId);
            }

            // Re-render the current track's rows after a probe answered.
            function renderCurrentRows(trackId) {
                if (lastTrackData && lastTrackData.TrackId === trackId) {
                    renderRows(lastTrackData);
                }
            }

            source.addEventListener('status', (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    return;
                }
                const active = typeof data.Status === 'string';
                playBtn.classList.toggle('playing', data.Status === 'Playing');
                playerctlAvailable = active;
                controls.hidden = !active;
            });

            artEl.onerror = () => {
                if (artEl.src !== new URL('cover.svg', location.href).href) {
                    artEl.src = 'cover.svg';
                }
            };

            source.onerror = () => {
                if (!trackEl.innerText || trackEl.innerText === 'Loading...') {
                    trackEl.innerText = ''
                    add_span(trackEl);
                }
            };
        });

        const playBtn = document.querySelector('.btn-play');

        let durationMs = 0;
        let positionMs = 0;
        let lastTickTs = Date.now();
        let lastTrackId = null;
        let progressActive = false;
        let playerctlAvailable = false;
        let positionSynced = false;
        let lastRenderKey = null;
        // Current track's MusicBrainz recording id (null when unresolved);
        // `similarSeq` invalidates in-flight ListenBrainz dialog fetches.
        let currentMbid = null;
        let similarSeq = 0;
        // Whether ListenBrainz has similar recordings for the current track (the
        // title row only becomes clickable once it does) and the last payload it
        // was rendered from, so the probe can re-render the rows when it answers.
        let similarActive = false;
        // Whether ListenBrainz has similar *artists* for the current track's
        // artist (LB Radio's pool is empty for many of them).
        let similarArtistsActive = false;
        let similarProbedId = null;
        let similarCheckSeq = 0;
        let similarArtistCheckSeq = 0;
        let lastTrackData = null;
        const progressBar = document.getElementById('progress');
        const progressFill = document.getElementById('progress-fill');
        const progressTip = document.getElementById('progress-tip');

        function formatMs(ms) {
            const totalSec = Math.max(0, Math.floor(ms / 1000));
            const m = Math.floor(totalSec / 60);
            const s = String(totalSec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateProgressTip() {
            const label = durationMs ? `${formatMs(positionMs)} / ${formatMs(durationMs)}` : '';
            progressTip.textContent = label;
        }

        function updateProgress() {
            if (!durationMs || !playerctlAvailable || !positionSynced) {
                progressBar.hidden = true;
                return;
            }
            progressBar.hidden = false;
            const now = Date.now();
            if (progressActive && playBtn.classList.contains('playing')) {
                positionMs += now - lastTickTs;
            }
            lastTickTs = now;
            if (positionMs >= durationMs) {
                positionMs = durationMs;
                progressActive = false;
            }
            progressFill.style.width = (Math.min(1, positionMs / durationMs) * 100).toFixed(2) + '%';
            updateProgressTip();
        }

        async function fetchPosition() {
            try {
                const res = await fetch('/api/player/position');
                if (!res.ok) return;
                const data = await res.json();
                if (typeof data.Position !== 'number') return;
                positionMs = data.Position;
                lastTickTs = Date.now();
                progressActive = true;
                positionSynced = true;
            } catch {
                // ignore; SSE position events remain the live source
            }
        }

        async function sendControl(action) {
            if (action === 'play-pause') {
                playBtn.classList.toggle('playing');
            }
            if (action === 'previous') {
                positionMs = 0;
                lastTickTs = Date.now();
                progressActive = true;
            }
            try {
                await fetch(`/api/player/${action}`, { method: 'POST' });
            } catch {
                // ignore; playback state is reconciled by the next status event
            }
        }

        document.querySelectorAll('.btn').forEach((btn) => {
            btn.addEventListener('click', () => sendControl(btn.dataset.action));
        });

        setInterval(updateProgress, 1000);

        source.addEventListener('position', (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }
            if (typeof data.Position !== 'number') {
                return;
            }
            positionMs = data.Position;
            lastTickTs = Date.now();
            progressActive = true;
            positionSynced = true;
        });

        function renderMarkdown(text) {
            const esc = (s) =>
                s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const inline = (s) =>
                s
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, label, url) => {
                        let u;
                        try {
                            u = new URL(url, location.href);
                        } catch {
                            return label;
                        }
                        if (u.protocol !== 'http:' && u.protocol !== 'https:') return label;
                        return `<a href="${u.href}" target="_blank" rel="noreferrer noopener">${label}</a>`;
                    })
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>');
            const out = [];
            let inList = false;
            let inQuote = false;
            const flush = () => {
                if (inList) { out.push('</ul>'); inList = false; }
                if (inQuote) { out.push('</blockquote>'); inQuote = false; }
            };
            for (const raw of text.split('\n')) {
                const line = raw.trim();
                if (!line) { flush(); continue; }
                const h1 = line.match(/^###\s+(.*)$/);
                const h2 = line.match(/^##\s+(.*)$/);
                const h3 = line.match(/^#\s+(.*)$/);
                if (h1 || h2 || h3) {
                    flush();
                    const tag = h1 ? 'h3' : h2 ? 'h4' : 'h5';
                    out.push(`<${tag}>${inline(esc((h1 || h2 || h3)[1]))}</${tag}>`);
                    continue;
                }
                if (line.startsWith('- ')) {
                    if (!inList) { out.push('<ul>'); inList = true; }
                    out.push(`<li>${inline(esc(line.slice(2)))}</li>`);
                    continue;
                }
                if (line.startsWith('> ')) {
                    if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
                    out.push(`<p>${inline(esc(line.slice(2)))}</p>`);
                    continue;
                }
                flush();
                out.push(`<p>${inline(esc(line))}</p>`);
            }
            flush();
            return out.join('\n');
        }

        const popup = document.getElementById('review-popup');
        const popupCard = document.querySelector('.review-popup-card');
        const popupTitle = document.getElementById('review-title');
        const popupBody = document.getElementById('review-body');
        const popupClose = document.getElementById('review-close');

        const SIMILAR_LIMIT = 12;
        const SIMILAR_ARTIST_LIMIT = 10;

        function resetPopupMode() {
            popupCard.classList.remove('wide');
            popupBody.classList.remove('popup-table');
        }

        function openReview(review, title) {
            similarSeq += 1; // drop any in-flight similar-tracks fetch
            resetPopupMode();
            popupTitle.textContent = title;
            popupBody.innerHTML = renderMarkdown(review);
            popup.hidden = false;
            document.body.classList.add('no-scroll');
        }

        function closeReview() {
            similarSeq += 1; // drop any in-flight similar-tracks fetch
            popup.hidden = true;
            popupBody.innerHTML = '';
            resetPopupMode();
            document.body.classList.remove('no-scroll');
        }

        function statusLine(text) {
            const p = document.createElement('p');
            p.className = 'popup-status';
            p.textContent = text;
            return p;
        }

        // Build a table row by row (never from a rendered string) so titles and
        // albums can't inject markup.

        const MBID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

        function listenbrainzUrl(mbid, kind) {
            return typeof mbid === 'string' && MBID_RE.test(mbid)
                ? `https://listenbrainz.org/${kind}/${mbid}/`
                : null;
        }

        function buildTable(headers, className) {
            const table = document.createElement('table');
            table.className = className ? `similar-table ${className}` : 'similar-table';
            const row = table.createTHead().insertRow();
            for (const [label, cellClass] of headers) {
                const th = document.createElement('th');
                th.textContent = label;
                if (cellClass) th.className = cellClass;
                row.appendChild(th);
            }
            table.createTBody();
            return table;
        }

        // A row (and its name anchor) opens `url`; the anchor keeps the row
        // keyboard accessible and handles the modifier/middle clicks a row can't.
        // An empty label stays plain text - an anchor without text is invisible
        // but still focusable.
        function linkCell(cell, text, url, title) {
            if (!url || !text) {
                cell.textContent = text;
                return;
            }
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noreferrer noopener';
            if (title) link.title = title;
            link.textContent = text;
            cell.appendChild(link);
        }

        // Similar tracks: ListenBrainz Labs' co-listening score per recording.
        function buildSimilarTable(tracks) {
            const table = buildTable([
                ['#', 'num'], ['', ''], ['Artist', ''], ['Title', ''],
                ['Album', ''], ['Match', 'num'],
            ]);
            const body = table.tBodies[0];
            tracks.forEach((track, index) => {
                const row = body.insertRow();
                const rank = row.insertCell();
                rank.className = 'num';
                rank.textContent = String(index + 1);
                const art = row.insertCell();
                if (typeof track.Cover === 'string' && track.Cover.startsWith('https://')) {
                    const img = document.createElement('img');
                    img.className = 'similar-cover';
                    img.src = track.Cover;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.addEventListener('error', () => img.remove());
                    art.appendChild(img);
                }
                const url = listenbrainzUrl(track.ArtistMBID, 'artist');
                const artistCell = row.insertCell();
                linkCell(artistCell, track.Artist || '', url);
                // The title points at the recording itself on ListenBrainz.
                const trackUrl = listenbrainzUrl(track.MBID, 'recording');
                const titleCell = row.insertCell();
                linkCell(
                    titleCell,
                    track.Title || '',
                    trackUrl,
                    'Open the recording on ListenBrainz'
                );
                row.insertCell().textContent = track.Album || '';
                const score = row.insertCell();
                score.className = 'num';
                score.textContent = typeof track.Score === 'number'
                    ? track.Score.toLocaleString()
                    : '';
                if (url) {
                    row.classList.add('linked');
                    row.title = 'Open the artist on ListenBrainz';
                    row.addEventListener('click', (event) => {
                        if (event.target.closest('a')) return;
                        window.open(url, '_blank', 'noopener');
                    });
                }
            });
            return table;
        }

        // Similar artists: LB Radio's artist pool, one sample track per artist.
        function buildArtistTable(artists) {
            const table = buildTable(
                [['#', 'num'], ['Artist', ''], ['Sample track', ''], ['Listens', 'num']],
                'artists'
            );
            const body = table.tBodies[0];
            artists.forEach((artist, index) => {
                const row = body.insertRow();
                const rank = row.insertCell();
                rank.className = 'num';
                rank.textContent = String(index + 1);
                const url = listenbrainzUrl(artist.ArtistMBID, 'artist');
                const artistCell = row.insertCell();
                linkCell(artistCell, artist.Artist || '', url);
                // The sample track points at the recording on ListenBrainz.
                const trackUrl = listenbrainzUrl(artist.MBID, 'recording');
                const trackCell = row.insertCell();
                linkCell(
                    trackCell,
                    artist.Title || '',
                    trackUrl,
                    'Open the recording on ListenBrainz'
                );
                const listens = row.insertCell();
                listens.className = 'num';
                listens.textContent = typeof artist.Listens === 'number'
                    ? artist.Listens.toLocaleString()
                    : '';
                if (url) {
                    row.classList.add('linked');
                    row.title = 'Open the artist on ListenBrainz';
                    row.addEventListener('click', (event) => {
                        if (event.target.closest('a')) return;
                        window.open(url, '_blank', 'noopener');
                    });
                }
            });
            return table;
        }

        // Shared dialog loader for both ListenBrainz lookups: opens the wide
        // table popup, fetches `url`, and renders `data[field]` with `build`.
        // `similarSeq` invalidates a fetch whose popup has since been replaced.
        async function loadPopupTable({ label, url, field, noun, build, empty }) {
            const seq = ++similarSeq;
            resetPopupMode();
            popupCard.classList.add('wide');
            popupBody.classList.add('popup-table');
            popupTitle.textContent = label;
            popupBody.replaceChildren(statusLine('Searching ListenBrainz…'));
            popup.hidden = false;
            document.body.classList.add('no-scroll');

            let data;
            try {
                const res = await fetch(url);
                if (seq !== similarSeq) return;
                if (!res.ok) {
                    let detail = `HTTP ${res.status}`;
                    try {
                        const body = await res.json();
                        if (body && body.detail) detail = body.detail;
                    } catch {
                        // non-JSON error body; keep the status text
                    }
                    popupBody.replaceChildren(statusLine(`Could not load ${noun}: ${detail}`));
                    return;
                }
                data = await res.json();
            } catch {
                if (seq === similarSeq) {
                    popupBody.replaceChildren(statusLine('Could not reach ListenBrainz.'));
                }
                return;
            }
            if (seq !== similarSeq) return;

            const rows = data && Array.isArray(data[field]) ? data[field] : [];
            popupBody.replaceChildren(rows.length ? build(rows) : statusLine(empty));
        }

        // Similar recordings for the current track (seeded on its MusicBrainz
        // recording id; the server caches them for an hour).
        function openSimilar(trackId, label) {
            if (!trackId) return;
            return loadPopupTable({
                label,
                url: `/api/track/${trackId}/similar?limit=${SIMILAR_LIMIT}`,
                field: 'Tracks',
                noun: 'similar tracks',
                build: buildSimilarTable,
                empty: 'No similar tracks found for this track yet.',
            });
        }

        // Similar artists for the current track's artist.
        function openSimilarArtists(trackId, label) {
            if (!trackId) return;
            return loadPopupTable({
                label,
                url: `/api/track/${trackId}/similar-artists?limit=${SIMILAR_ARTIST_LIMIT}`,
                field: 'Artists',
                noun: 'similar artists',
                build: buildArtistTable,
                empty: 'No similar artists found for this artist yet.',
            });
        }

        popupClose.addEventListener('click', closeReview);
        popup.addEventListener('click', (e) => {
            if (e.target === popup) closeReview();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !popup.hidden) closeReview();
        });
    </script>
</body>
</html>
